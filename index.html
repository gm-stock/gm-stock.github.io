<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GM 재고">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<title>재고관리</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Pretendard Variable','Pretendard',sans-serif;display:flex;flex-direction:column;height:100dvh;transition:background .3s,color .3s}
body.dark{background:#0a0a0f;color:#e2e8f0}
body.light{background:#f5f5f7;color:#111827}
input,textarea,select{outline:none;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
body.dark ::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:99px}
body.light ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}
#app-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-shrink:0;backdrop-filter:blur(12px)}
body.dark #app-header{background:rgba(10,10,15,0.97);border-bottom:1px solid rgba(255,255,255,0.07)}
body.light #app-header{background:rgba(245,245,247,0.97);border-bottom:1px solid rgba(0,0,0,0.08)}
.logo-box{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.theme-toggle{position:relative;width:52px;height:28px;border-radius:99px;cursor:pointer;border:none;flex-shrink:0;transition:background .3s}
body.dark .theme-toggle{background:#334155}
body.light .theme-toggle{background:#fbbf24}
.theme-knob{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .3s;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,0.25)}
body.dark .theme-knob{left:3px}
body.light .theme-knob{left:27px}
#bottom-nav{display:flex;flex-shrink:0}
body.dark #bottom-nav{background:rgba(10,10,15,0.97);border-top:1px solid rgba(255,255,255,0.07)}
body.light #bottom-nav{background:rgba(245,245,247,0.97);border-top:1px solid rgba(0,0,0,0.08)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 11px;gap:3px;font-size:10px;font-weight:600;background:transparent;position:relative;transition:color .15s}
body.dark .nav-btn{color:#475569}
body.light .nav-btn{color:#9ca3af}
.nav-btn.active{color:#6366f1}
.nav-icon{font-size:19px}
.nav-badge{position:absolute;top:6px;right:50%;transform:translateX(10px);min-width:16px;height:16px;border-radius:99px;background:#ef4444;font-size:9px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px}
#app-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.tab-pane.active{display:block}
.page-scroll{padding:12px 14px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-tile{border-radius:12px;padding:13px}
body.dark .stat-tile{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07)}
body.light .stat-tile{background:#fff;border:1px solid rgba(0,0,0,0.08)}
.stat-val{font-size:18px;font-weight:800}
.stat-lbl{font-size:10px;margin-top:2px}
body.dark .stat-lbl{color:#475569}
body.light .stat-lbl{color:#6b7280}
.filter-label{font-size:10px;font-weight:600;margin-bottom:5px}
body.dark .filter-label{color:#475569}
body.light .filter-label{color:#6b7280}
.filter-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;flex-wrap:wrap}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
body.dark .fbtn{border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#64748b}
body.light .fbtn{border:1px solid rgba(0,0,0,0.1);background:rgba(0,0,0,0.04);color:#6b7280}
.fbtn.on{background:linear-gradient(135deg,#3b82f6,#6366f1)!important;border-color:transparent!important;color:#fff!important}
.collection-group{margin-bottom:16px}
.coll-header{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;user-select:none}
body.dark .coll-header{background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:10px 10px 0 0}
body.light .coll-header{background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.25);border-radius:10px 10px 0 0}
.coll-header.collapsed{border-radius:10px!important}
.items-wrap{padding:8px;border-top:none;border-radius:0 0 10px 10px}
body.dark .items-wrap{background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.07)}
body.light .items-wrap{background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.08)}
.item-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:start}
@media(max-width:900px){.item-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.item-grid{grid-template-columns:repeat(2,1fr)}}
.item-card{border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
body.dark .item-card{background:#0f1020;border:1px solid rgba(255,255,255,0.07)}
body.light .item-card{background:#fff;border:1px solid rgba(0,0,0,0.08)}
.item-body{flex:1}
.item-card.low-stock{border-color:rgba(239,68,68,0.35)!important}
.item-img{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden}
body.dark .item-img{background:rgba(255,255,255,0.03)}
body.light .item-img{background:rgba(0,0,0,0.04)}
.item-img img{width:100%;height:100%;object-fit:contain}
.low-mask{position:absolute;inset:0;background:rgba(239,68,68,0.35);pointer-events:none}
.item-body{padding:9px 10px;flex:1;display:flex;flex-direction:column;gap:3px}
.item-name{font-weight:700;font-size:12px;line-height:1.3}
body.dark .item-name{color:#e2e8f0}
body.light .item-name{color:#111827}
.item-sub{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dark .item-sub{color:#475569}
body.light .item-sub{color:#6b7280}
.item-qty{font-size:17px;font-weight:800;margin-top:2px}
.unit{font-size:10px;font-weight:400}
body.dark .unit{color:#475569}
body.light .unit{color:#6b7280}
.opts-panel{border-top:1px solid rgba(128,128,128,0.1);padding:6px 10px;max-height:160px;overflow-y:auto}
body.dark .opts-panel{background:rgba(0,0,0,0.3)}
body.light .opts-panel{background:rgba(0,0,0,0.03)}
.opt-row{display:flex;align-items:center;gap:6px;padding:5px 0}
.opt-row+.opt-row{border-top:1px solid rgba(128,128,128,0.07)}
.opt-name{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dark .opt-name{color:#94a3b8}
body.light .opt-name{color:#6b7280}
.opt-qty{font-weight:800;font-size:13px;flex-shrink:0}
.btn-cart{width:100%;padding:6px 0;border-radius:7px;font-size:11px;font-weight:700;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#a5b4fc;margin-top:6px}
.card-actions{padding:6px 8px;border-top:1px solid rgba(128,128,128,0.1)}
.cart-item{border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
body.dark .cart-item{background:#0f1020;border:1px solid rgba(255,255,255,0.07)}
body.light .cart-item{background:#fff;border:1px solid rgba(0,0,0,0.08)}
.week-group{margin-bottom:20px}
.week-header{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:12px}
body.dark .week-header{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:10px 10px 0 0}
body.light .week-header{background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.2);border-radius:10px 10px 0 0}
.week-cycle{display:flex;gap:8px;flex-wrap:wrap;padding:7px 14px}
body.dark .week-cycle{background:rgba(255,255,255,0.02);border-left:1px solid rgba(59,130,246,0.2);border-right:1px solid rgba(59,130,246,0.2)}
body.light .week-cycle{background:rgba(0,0,0,0.02);border-left:1px solid rgba(59,130,246,0.2);border-right:1px solid rgba(59,130,246,0.2)}
.order-list{overflow:hidden;border-radius:0 0 10px 10px}
body.dark .order-list{border:1px solid rgba(59,130,246,0.2);border-top:none}
body.light .order-list{border:1px solid rgba(59,130,246,0.2);border-top:none}
.order-row{padding:12px 14px}
.order-row+.order-row{border-top:1px solid rgba(128,128,128,0.08)}
body.dark .order-row:nth-child(even){background:rgba(255,255,255,0.02)}
body.light .order-row:nth-child(even){background:rgba(0,0,0,0.02)}
.status-badge{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600}
.status-ready{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.status-done{background:rgba(52,211,153,0.15);color:#34d399;border:1px solid rgba(52,211,153,0.3)}
.item-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:6px;margin:2px}
body.dark .item-chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#94a3b8}
body.light .item-chip{background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.08);color:#6b7280}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal-sheet{border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:20px 18px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:85dvh;overflow-y:auto}
body.dark .modal-sheet{background:#13141f}
body.light .modal-sheet{background:#fff}
.modal-handle{width:36px;height:4px;border-radius:2px;margin:0 auto 16px}
body.dark .modal-handle{background:rgba(255,255,255,0.15)}
body.light .modal-handle{background:rgba(0,0,0,0.1)}
.modal-title{font-weight:800;font-size:16px;margin-bottom:14px}
.field-label{font-size:12px;font-weight:600;margin-bottom:5px}
body.dark .field-label{color:#94a3b8}
body.light .field-label{color:#6b7280}
.field-wrap{margin-bottom:12px}
.field-input{width:100%;border-radius:10px;padding:10px 13px;font-size:14px}
body.dark .field-input{background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);color:#e2e8f0}
body.light .field-input{background:rgba(0,0,0,0.04);border:1.5px solid rgba(0,0,0,0.1);color:#111827}
.field-input:focus{border-color:#6366f1}
.btn-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:700;font-size:15px;margin-top:6px}
.btn-secondary-sm{padding:11px;border-radius:12px;font-weight:600;font-size:14px;margin-top:8px;width:100%}
body.dark .btn-secondary-sm{background:rgba(255,255,255,0.06);color:#94a3b8;border:none}
body.light .btn-secondary-sm{background:rgba(0,0,0,0.05);color:#6b7280;border:none}
.opt-sel-btn{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;margin:3px}
body.dark .opt-sel-btn{border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#64748b}
body.light .opt-sel-btn{border:1.5px solid rgba(0,0,0,0.1);background:rgba(0,0,0,0.04);color:#6b7280}
.opt-sel-btn.sel{border-color:#6366f1;background:rgba(99,102,241,0.2);color:#a5b4fc}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;z-index:200;display:none;white-space:nowrap}
body.dark #toast{background:rgba(20,20,40,0.97);border:1px solid rgba(255,255,255,0.12);color:#e2e8f0}
body.light #toast{background:#1f2937;color:#f9fafb}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
body.dark #loading{background:#0a0a0f}
body.light #loading{background:#f5f5f7}
.spinner{width:36px;height:36px;border:3px solid rgba(99,102,241,0.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── 매장 로그인 ── */
#login-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:1000;overflow-y:auto}
body.dark #login-screen{background:#0a0a0f}
body.light #login-screen{background:#f5f5f7}
.login-card{width:100%;max-width:340px;text-align:center}
.login-card input{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:inherit}
body.light .login-card input{border-color:rgba(0,0,0,0.12);background:#fff}
.login-card input:focus{border-color:#6366f1}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);cursor:pointer}
.login-btn:disabled{opacity:.6;cursor:default}
.login-err{min-height:20px;margin:10px 0 0;font-size:13px;color:#f87171;line-height:1.5}
.login-langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:22px}
.login-langs button{padding:6px 10px;border-radius:99px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#94a3b8}
body.light .login-langs button{border-color:rgba(0,0,0,0.12);color:#475569}
.login-langs button.on{border-color:#6366f1;color:#a5b4fc}
.logout-btn{padding:6px 9px;border-radius:99px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.07);color:inherit;white-space:nowrap}
body.light .logout-btn{border-color:rgba(0,0,0,0.12);background:#fff}

/* ══ 새 디자인 바탕 (2026-10 리디자인 1단계) ══
   색·글꼴·모서리만 바꾼다. 기능과 화면 구성은 그대로. */
body.light{--bg:#f7f6f3;--surface:#ffffff;--ink:#111111;--sub:#4a4a4a;--muted:#8a8780;--line:#dcdad4;--line2:#ebe9e4;--low:#b3001b;--accent:#c2410c;--accent-ink:#ffffff;--hover:#efede8;--ok:#2f5a2b;--ok-bg:#e9f2e5}
body.dark{--bg:#121211;--surface:#1b1b1a;--ink:#f1efea;--sub:#c3c0b8;--muted:#8f8c85;--line:#34332f;--line2:#262523;--low:#ff5c70;--accent:#f0782f;--accent-ink:#111111;--hover:#242422;--ok:#9fd39a;--ok-bg:#1f3320}
body.light,body.dark{background:var(--bg);color:var(--ink);font-family:'Roboto','Nanum Gothic','Pretendard Variable','Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
body.light ::-webkit-scrollbar-thumb,body.dark ::-webkit-scrollbar-thumb{background:var(--line);border-radius:0}
/* 헤더·하단 메뉴 (헤더는 밝기와 상관없이 항상 검정) */
#app-header{--hbg:#111111;--hfg:#f7f6f3}
body.dark #app-header{--hbg:#0b0b0b;border-bottom:1px solid var(--line)!important}
body.light #app-header,body.dark #app-header{background:var(--hbg);color:var(--hfg);border-bottom:0;backdrop-filter:none}
body.light #app-header .stat-lbl,body.dark #app-header .stat-lbl{color:var(--hfg);opacity:.7}
.logo-box{border-radius:0;background:var(--hfg)!important;color:var(--hbg);font-size:11px;font-weight:900;letter-spacing:.06em}
body.light .theme-toggle,body.dark .theme-toggle{border-radius:0;background:transparent;border:1px solid currentColor;color:var(--hfg)}
.theme-knob{border-radius:0;background:var(--hfg);box-shadow:none}
.logout-btn,body.light .logout-btn{border-radius:0;border:1px solid var(--hfg)!important;background:transparent!important;color:var(--hfg)!important}
#app-header [onclick="toggleLangMenu()"]{border-radius:0!important;background:transparent!important;border:1px solid var(--hfg)!important;color:var(--hfg)!important}
#lang-menu{border-radius:0!important;background:var(--surface)!important;border:1px solid var(--ink)!important;box-shadow:0 8px 24px rgba(0,0,0,.25)!important}
#lang-menu .lang-opt{color:var(--ink)!important}
#lang-menu .lang-opt:hover{background:var(--hover)}
body.light #bottom-nav,body.dark #bottom-nav{background:var(--surface);border-top:1px solid var(--ink)}
body.light .nav-btn,body.dark .nav-btn{color:var(--muted)}
body.light .nav-btn.active,body.dark .nav-btn.active{color:var(--ink);font-weight:900}
.nav-btn.active::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--ink)}
.nav-badge{background:var(--accent);color:var(--accent-ink);border-radius:0}
/* 요약 숫자·필터 */
.stat-tile{border-radius:0}
body.light .stat-tile,body.dark .stat-tile{background:var(--surface);border:1px solid var(--line)}
body.light .stat-lbl,body.dark .stat-lbl,body.light .filter-label,body.dark .filter-label{color:var(--sub);letter-spacing:.04em}
.fbtn{border-radius:0;letter-spacing:.03em}
body.light .fbtn,body.dark .fbtn{background:var(--surface);border:1px solid var(--line);color:var(--sub)}
.fbtn.on{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--bg)!important}
/* 컬렉션 묶음·상품 카드 */
body.light .coll-header,body.dark .coll-header{background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:10px 2px;letter-spacing:.08em}
.coll-header.collapsed{border-radius:0!important}
body.light .items-wrap,body.dark .items-wrap{background:transparent;border:0;border-radius:0;padding:10px 0 0}
.item-card{border-radius:0}
body.light .item-card,body.dark .item-card{background:var(--surface);border:1px solid var(--line)}
.item-card.low-stock{border-color:var(--low)!important}
body.light .item-img,body.dark .item-img{background:var(--line2)}
body.light .item-name,body.dark .item-name{color:var(--ink);font-weight:900;letter-spacing:.02em}
body.light .item-sub,body.dark .item-sub,body.light .unit,body.dark .unit{color:var(--muted)}
body.light .opts-panel,body.dark .opts-panel{background:transparent}
body.light .opt-name,body.dark .opt-name{color:var(--sub)}
.btn-cart{border-radius:0;background:var(--surface);border:1px solid var(--ink);color:var(--ink);letter-spacing:.04em}
.btn-cart:active{background:var(--ink);color:var(--bg)}
/* 장바구니·출고요청 목록 */
.cart-item{border-radius:0}
body.light .cart-item,body.dark .cart-item{background:var(--surface);border:1px solid var(--line)}
body.light .week-header,body.dark .week-header{background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:10px 2px}
body.light .week-cycle,body.dark .week-cycle{background:transparent;border-left:0;border-right:0}
.order-list{border-radius:0}
body.light .order-list,body.dark .order-list{border:1px solid var(--line);border-top:0;background:var(--surface)}
body.light .order-row:nth-child(even),body.dark .order-row:nth-child(even){background:transparent}
.order-row+.order-row{border-top:1px solid var(--line2)}
.status-badge{border-radius:0}
.item-chip{border-radius:0}

function detectLang(){
  try{ const s=localStorage.getItem("gm-lang"); if(s&&I18N[s]) return s; }catch(e){}
  const n=(navigator.language||"ko").toLowerCase();
  if(n.startsWith("ko")) return "ko";
  if(n.startsWith("ja")) return "ja";
  if(n.startsWith("zh")){
    if(n.includes("tw")||n.includes("hk")||n.includes("hant")||n.includes("mo")) return "zh-TW";
    return "zh-CN";
  }
  return "en";
}
let LANG=detectLang();
// t("key") 또는 t("key",{n:3}) — 없는 키는 한국어로 대체
function t(key,vars){
  let s=(I18N[LANG]&&I18N[LANG][key])||I18N.ko[key]||key;
  if(vars) for(const k in vars) s=s.split("{"+k+"}").join(vars[k]);
  return s;
}
// 재고 옵션값(한국어/일본어 등) 번역

function tOpt(name){ const k=OPT_KEY[name]; return k?t(k):name; }
// 숫자+단위: 라틴 문자권은 사이에 공백, CJK는 붙여쓰기
// 저장된 한국어 값을 화면 표시용으로만 변환 (DB 값은 그대로 유지)
const DAY_DISP={ko:["일","월","화","수","목","금","토"],ja:["日","月","火","水","木","金","土"],
  en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],"zh-CN":["日","一","二","三","四","五","六"],"zh-TW":["日","一","二","三","四","五","六"]};
const KO_DAYS=["일","월","화","수","목","금","토"];
// 배지처럼 단독 표기 시 (중국어는 "周一" 형태가 명확)
const DAY_BADGE={ko:KO_DAYS,ja:["日","月","火","水","木","金","土"],
  en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
  "zh-CN":["周日","周一","周二","周三","周四","周五","周六"],
  "zh-TW":["週日","週一","週二","週三","週四","週五","週六"]};
function fmtWeek(label){                       // "7/20(월)~7/24(금)" → 언어별 표기
  if(LANG==="ko"||!label) return label;
  const d=DAY_DISP[LANG]||KO_DAYS;
  return String(label).replace(/\(([일월화수목금토])\)/g,(m,k)=>"("+d[KO_DAYS.indexOf(k)]+")");
}
const STATUS_KEY={"검토중":"st_review","승인":"st_approved","준비중":"st_preparing",
  "출고대기":"st_ready","출고완료":"st_shipped","반려":"st_rejected","취소":"st_cancelled"};
function tStatus(s){ const k=STATUS_KEY[s]; return k?t(k):s; }
const TYPE_KEY={"파손":"type_damaged","부족":"type_shortage","오픈":"type_open"};
function tType(v){ const k=TYPE_KEY[v]; return k?t(k):v; }
function fmtReason(r){                          // "[파손] 사유" → "[Damaged] 사유"
  if(LANG==="ko"||!r) return r;
  return String(r).replace(/^\[(파손|부족|오픈)\]/,(m,k)=>"["+tType(k)+"]");
}
function nu(n,unitKey){
  if(LANG!=="en") return n+t(unitKey);
  let u=t(unitKey);
  const num=parseFloat(String(n).replace(/,/g,""));
  if(num===1) u=u.replace(/s$/,"");   // 1 type / 1 pc
  return n+" "+u;
}

function getWeekLabel(dateStr){
  const d=new Date(dateStr);
  const day=d.getDay(); // 0=일,1=월,...,6=토
  const mon=new Date(d);
  if(day===0) mon.setDate(d.getDate()+1);      // 일→다음주 월
  else if(day===6) mon.setDate(d.getDate()+2); // 토→다음주 월
  else mon.setDate(d.getDate()-(day-1));        // 월(1)~금(5)→이번주 월
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const fmt=dt=>`${dt.getMonth()+1}/${dt.getDate()}`;
  const days=["일","월","화","수","목","금","토"];
  return `${fmt(mon)}(${days[mon.getDay()]})~${fmt(fri)}(${days[fri.getDay()]})`;
}

    orders=snap.docs.map(d=>({...d.data(),id:d.id}));
    renderOrders();
  },err=>{console.error(err);}));
  // 추가 매장 목록 (매장명 자동완성)
  dataUnsubs.push(onSnapshot(collection(db,"storeNames"),snap=>{

  dataUnsubs.push(onSnapshot(collection(db,"shipments"),snap=>{

    showLogin(pendingLoginErr);

    const [st,ad]=await Promise.all([

// ── 엑셀 오픈 발주 처리 ──
const XL_SKIP_NAMES = ["합계 수량","합계","합 계","총 재고","총계","TOTAL","Total"];
const xlUp     = s => String(s||"").trim().toUpperCase();
const xlNoOpt  = s => { const v = String(s||"").trim(); return !v || v==="-" || v==="–" || v==="—" || xlUp(v)==="N/A"; };
window.handleOpenOrderExcel = async(input) => {
  const file = input.files[0];
  if (!file) return;
  input.value = "";

  showToast(t("xl_reading"), "var(--ink)");

  const reader = new FileReader();
  reader.onload = async(e) => {
    try {
      const wb = XLSX.read(e.target.result, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});

      // 헤더 찾기 (컬렉션, 상품명, 옵션, 수량 포함한 행)
      let headerRow = -1;
      for (let i = 0; i < Math.min(rows.length, 5); i++) {
        const r = rows[i].map(c => String(c||"").trim());
        if (r.some(c => c.includes("상품명") || c.includes("컬렉션"))) {
          headerRow = i; break;
        }
      }
      if (headerRow === -1) { showToast(t("xl_badformat"), "var(--low)"); return; }

      const headers = rows[headerRow].map(c => String(c||"").trim());
      const collIdx = headers.findIndex(h => h.includes("컬렉션"));
      const nameIdx = headers.findIndex(h => h.includes("상품명"));
      const optIdx  = headers.findIndex(h => h.includes("옵션"));
      const qtyIdx  = headers.findIndex(h => h.includes("수량"));

      if (nameIdx === -1 || qtyIdx === -1) {
        showToast(t("xl_nocol"), "var(--low)"); return;
      }

      // 데이터 파싱
      let curColl = "", curName = "";
      const parsed = [];

      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i];
        const coll = String(collIdx >= 0 ? row[collIdx]||"" : "").trim();
        const name = String(nameIdx >= 0 ? row[nameIdx]||"" : "").trim();
        const opt  = String(optIdx  >= 0 ? row[optIdx] ||"" : "").trim();
        const qty  = parseInt(row[qtyIdx]) || 0;

        if (coll) curColl = coll;
        if (name) curName = name;
        if (!curName) continue;
        if (XL_SKIP_NAMES.indexOf(curName) >= 0) continue; // 합계 줄은 건너뜀
        if (qty <= 0) continue; // 수량 0이면 건너뜀

        parsed.push({ collection: curColl, name: curName, opt, qty });
      }

      if (!parsed.length) {
        showToast(t("xl_noqty"), "var(--low)"); return;
      }

      // 재고 매칭 및 부족 검사
      const matched = [], insufficient = [], notFound = [];

      parsed.forEach(p => {
        // 엑셀의 "-" / 빈칸 = 옵션 없음
        const po = xlNoOpt(p.opt) ? "" : String(p.opt).trim();

        // 상품명(+컬렉션)으로 매칭 — 값이 없어도 터지지 않게
        const item = items.find(i => xlUp(i.name)===xlUp(p.name) &&
                                     (!p.collection || xlUp(i.collection)===xlUp(p.collection)))
                  || items.find(i => xlUp(i.name)===xlUp(p.name));
        if (!item) { notFound.push({...p, why:"재고에 없는 품목"}); return; }

        // 옵션이 "실제로" 있는 품목인지 (빈 배열은 옵션 없음)
        const opts = Array.isArray(item.options) ? item.options : [];
        let optName = null, stock = 0;

        if (opts.length) {
          if (!po) { notFound.push({...p, why:"옵션을 지정하지 않았어요"}); return; }
          const o = opts.find(x => xlUp(x.name)===xlUp(po))
                 || opts.find(x => xlUp(x.name).includes(xlUp(po)) || xlUp(po).includes(xlUp(x.name)));
          if (!o) { notFound.push({...p, why:"옵션명이 재고와 달라요"}); return; }
          optName = o.name;
          stock   = o.quantity || 0;
        } else {
          optName = null;
          stock   = item.quantity || 0;
        }

        const rec = {...p, opt: optName || "", item, optName, stock};
        if (stock < p.qty) insufficient.push({...rec, available: stock});
        else               matched.push(rec);
      });

      // 결과 모달 표시
      showOpenOrderReviewModal(matched, insufficient, notFound);

    } catch(err) {
      showToast(t("xl_readerr")+": "+err.message, "var(--low)");
    }
  };
  reader.readAsArrayBuffer(file);
};

  // 매칭/부족 데이터 저장

window.addOpenOrderToCart = () => {
  const modal = document.getElementById("open-order-modal");
  if(!modal) return;
  const matched = modal._matched || [];
  const insufficient = modal._insufficient || [];

  // 체크된 재고부족 품목은 남은 재고 수량만큼만
  const checkedInsuf = insufficient.filter((p,i) => {
    const cb = document.getElementById("insuf-"+i);
    return cb && cb.checked && p.stock > 0;
  }).map(p => ({...p, qty: p.stock}));

  const finalItems = [...matched, ...checkedInsuf];
  if (!finalItems.length) { showToast(t("ms_no_items"), "var(--low)"); return; }

  // 장바구니에 합치기 (이미 담긴 품목은 수량 합산, 재고 상한 적용)
  let added = 0, capped = 0;
  openOrderFromExcel = true;   // 발주서에서 '오픈' 자동 선택용
  finalItems.forEach(p => {
    const key = p.item.id + (p.optName || "");
    const exist = cart.find(x => x.key === key);
    if (exist) {
      const total = exist.qty + p.qty;
      if (total > p.stock) { exist.qty = p.stock; capped++; }
      else exist.qty = total;
    } else {
      cart.push({
        key,
        itemId: p.item.id,
        itemName: p.item.name,
        optName: p.optName || null,
        collection: p.item.collection,
        qty: p.qty,
        unit: p.item.unit || "개"
      });
    }
    added++;
  });

  modal.remove();
  updateCartBadge();
  renderCart();
  switchTab("cart");
  showToast(t("xl_cart_ok",{n:added}) + (capped ? " ("+t("xl_cart_capped",{n:capped})+")" : ""), "var(--ok)");
};

  // 드롭다운 컨테이너 생성
  const wrap = input.parentElement;
  wrap.style.position = "relative";
  const dropdown = document.createElement("div");
  dropdown.id = inputId + "-dropdown";
  dropdown.style.cssText = "position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:0;max-height:200px;overflow-y:auto;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4)";
  wrap.appendChild(dropdown);

  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ dropdown.style.display="none"; return; }
    const matches = STORE_LIST.filter(s => s.toLowerCase().includes(q));
    if(!matches.length){ dropdown.style.display="none"; return; }
    dropdown.innerHTML = matches.slice(0,8).map(s=>
      `<div onclick="document.getElementById('${inputId}').value='${s.replace(/'/g,"\'")}';document.getElementById('${inputId}-dropdown').style.display='none'"
        style="padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bg)"
        onmouseover="this.style.background='var(--bg)'"
        onmouseout="this.style.background=''">${s}</div>`
    ).join("");
    dropdown.style.display="block";
  });

  // 외부 클릭 시 드롭다운 닫기
  document.addEventListener("click", e=>{
    if(!wrap.contains(e.target)) dropdown.style.display="none";
  });
}

// 사진 미리보기 (최대 3장, 자동 압축)
let orderPhotosBase64=[];
let openOrderFromExcel=false;   // 엑셀로 담은 오픈 발주 여부
function compressImage(file, maxW=1600, quality=0.9){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        let w=img.width, h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
// ── 배송 이슈 접수 ──
// 관리자가 '시즌 배송'을 등록하고 접수를 열어 둔 동안만 탭이 열린다.
// 매장을 고르면 그 매장에 보낸 품목·수량이 나오고, 문제 품목마다 유형·사진·사유·재요청 수량을 적어 접수한다.
// 같은 매장·같은 품목의 접수 합계(반려 제외)는 배송 수량을 넘을 수 없다. 기한 = 오픈일 + 7일 밤 12시(한국 시간).
// 저장 값(유형·상태)은 한국어, 화면 표시만 번역한다.
let shipments=[], claims=[];
let clShipId="", clStore="", clSel={}, clReporter="";
const CL_DAYS=7;
const CL_TYPES=[["파손","ct_damage"],["불량","ct_defect"],["누락","ct_missing"]];
const CL_STATUS_KEY={"검토중":"cs_review","재발송 예정":"cs_resend","재발송 완료":"cs_done","반려":"cs_rejected"};
function clDeadline(openDate){ const d=new Date(openDate+"T23:59:59+09:00"); d.setDate(d.getDate()+CL_DAYS); return d; }
function clFmt(d){ const k=new Date(d.getTime()+9*3600e3); return `${k.getUTCFullYear()}-${String(k.getUTCMonth()+1).padStart(2,"0")}-${String(k.getUTCDate()).padStart(2,"0")}`; }
function clEsc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function openShipments(){ return shipments.filter(s=>s.open); }

function updateClaimTab(){
  const on=openShipments().length>0;
  const b=document.getElementById("top-claim");
  if(b){ b.disabled=!on; b.title=on?"":t("cl_closed_tab"); }
  if(!on && document.getElementById("tab-claim")?.classList.contains("active")) switchTab("stock");
}
function clClaimed(store,itemId,opt){
  return claims.filter(c=>c.shipmentId===clShipId&&c.storeName===store&&c.itemId===itemId&&(c.optName||"")===(opt||"")&&c.status!=="반려")
    .reduce((a,c)=>a+(c.qty||0),0);
}
function clKey(it){ return it.itemId+"|"+(it.optName||""); }

function renderClaim(){
  const page=document.getElementById("claim-page"); if(!page) return;
  const list=openShipments();
  if(!list.length){ page.innerHTML=`<div class="cl-panel cl-muted">${t("cl_closed_tab")}</div>`; return; }
  if(!list.find(s=>s.id===clShipId)){ clShipId=list[0].id; clStore=""; clSel={}; }
  const ship=list.find(s=>s.id===clShipId);
  const stores=Object.keys(ship.stores||{}).sort();
  if(clStore&&!stores.includes(clStore)){ clStore=""; clSel={}; }
  const dl=clDeadline(ship.openDate), expired=Date.now()>dl.getTime();

  let html=`<div class="cl-head"><div class="cl-title">${t("cl_title")}</div><div class="cl-sub">${t("cl_sub")}</div></div>
  <div class="cl-panel">
    <div class="cl-row">
      ${list.length>1?`<label class="cl-field"><span class="cl-label">${t("cl_season")}</span>
        <select id="cl-season" class="field-input">${list.map(s=>`<option value="${clEsc(s.id)}" ${s.id===clShipId?"selected":""}>${clEsc(s.title)}</option>`).join("")}</select></label>`:""}
      <label class="cl-field"><span class="cl-label">${t("cl_store")}</span>
        <select id="cl-store" class="field-input"><option value="">${t("cl_store_ph")}</option>
        ${clStoreGroups(stores).map(([cc,names])=>`<optgroup label="${clEsc(cc||"-")}">${names.map(n=>`<option ${n===clStore?"selected":""}>${clEsc(n)}</option>`).join("")}</optgroup>`).join("")}</select></label>
    </div>
    <div class="cl-dl ${expired?"cl-bad":""}">${expired?t("cl_expired",{d:clFmt(dl)}):t("cl_deadline",{d:clFmt(dl)})}</div>
  </div>
  <div class="cl-notice">${t("cl_wrongqty")} <button type="button" class="cl-link" data-act="goto-stock">${t("cl_goto_stock")} →</button></div>`;

  if(clStore && !expired){
    const shipped=ship.stores[clStore]||[];
    const total=shipped.reduce((a,it)=>a+it.qty,0);
    html+=`<div class="cl-panel">
      <div class="cl-meta"><b>${clEsc(clStore)}</b><span>${t("cl_shipped_sum",{n:shipped.length,q:total})}</span></div>
      <div class="cl-hint">${t("cl_pick")}</div>
      <div class="cl-items">${shipped.map(it=>clItemHTML(it)).join("")}</div>
      <label class="cl-field" style="margin-top:12px"><span class="cl-label">${t("cl_reporter")}</span>
        <input id="cl-reporter" class="field-input" placeholder="${clEsc(t("cl_reporter_ph"))}" value="${clEsc(clReporter)}" maxlength="40" autocomplete="off"></label>
      <div id="cl-err" class="cl-err"></div>
      <button type="button" class="btn-primary" id="cl-submit" data-act="submit">${t("cl_submit")}</button>
    </div>`;
  }
  if(clStore){
    const mine=claims.filter(c=>c.shipmentId===clShipId&&c.storeName===clStore);
    if(mine.length) html+=`<div class="cl-panel"><div class="cl-label" style="margin-bottom:6px">${t("cl_my")}</div>
      ${mine.map(c=>`<div class="cl-my">
        <div class="cl-my-name">${clEsc(c.itemName)}${c.optName?` <span class="cl-muted">${clEsc(tOpt(c.optName))}</span>`:""}</div>
        <div class="cl-muted">${t(CL_TYPES.find(x=>x[0]===c.type)?.[1]||"")} · ${c.qty}</div>
        <span class="cl-st cl-st-${CL_STATUS_KEY[c.status]||""}">${t(CL_STATUS_KEY[c.status]||"cs_review")}</span>
      </div>`).join("")}</div>`;
  }
  page.innerHTML=html;
  clValidate();
}

// 매장 선택 목록: 국가(매장명 끝의 " _ KR" 등)별로 묶는다. 국가 순서·국가 안 순서는 매장 목록(STORE_LIST) 순서를 따른다.
function clStoreGroups(stores){
  const ccOf=n=>((String(n).match(/_\s*([A-Za-z]+)\s*$/)||[])[1]||"").toUpperCase();
  const order=[]; STORE_LIST.forEach(n=>{ const c=ccOf(n); if(c&&!order.includes(c)) order.push(c); });
  const pos=n=>{ const i=STORE_LIST.indexOf(n); return i<0?1e9:i; };
  const groups={};
  stores.forEach(n=>{ (groups[ccOf(n)]=groups[ccOf(n)]||[]).push(n); });
  const rank=c=>c===""?2e9:(order.indexOf(c)<0?1e9:order.indexOf(c));
  return Object.keys(groups).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b))
    .map(c=>[c,groups[c].sort((a,b)=>pos(a)-pos(b)||a.localeCompare(b))]);
}
function clItemHTML(it){
  const k=clKey(it), st=clSel[k], done=clClaimed(clStore,it.itemId,it.optName), left=Math.max(0,it.qty-done);
  const name=`<div class="cl-name">${clEsc(it.itemName)}${it.optName?`<small>${clEsc(tOpt(it.optName))}</small>`:""}${done?`<small>${t("cl_already",{n:done})}</small>`:""}${!left?`<small>${t("cl_none_left")}</small>`:""}</div>`;
  const head=`<div class="cl-item-head ${left?"":"cl-off"}" data-k="${clEsc(k)}">
    <input type="checkbox" ${st?"checked":""} ${left?"":"disabled"} tabindex="-1" aria-hidden="true">${name}
    <div class="cl-qty">${t("cl_shipped",{n:it.qty})}</div></div>`;
  if(!st||!left) return `<div class="cl-item">${head}</div>`;
  const needPhoto=st.type==="파손"||st.type==="불량";
  return `<div class="cl-item on">${head}
    <div class="cl-form" data-k="${clEsc(k)}">
      <div><div class="cl-label">${t("cl_type")}</div><div class="cl-types">
        ${CL_TYPES.map(([v,key])=>`<button type="button" class="cl-chip" data-type="${v}" aria-pressed="${st.type===v}">${t(key)}</button>`).join("")}</div></div>
      <div><div class="cl-label">${t(needPhoto?"cl_photo_req":"cl_photo_opt")}</div>
        <div class="cl-photos">${st.photos.map((p,i)=>`<img src="${p}" alt="" data-del="${i}" title="✕">`).join("")}
        ${st.photos.length<3?`<label class="cl-addph">${st.busy?"…":"+"}<input type="file" accept="image/*" multiple hidden></label>`:""}</div></div>
      <div><div class="cl-label">${t("lbl_details")}</div>
        <textarea class="field-input" data-f="reason" rows="2" placeholder="${clEsc(t("cl_reason_ph"))}">${clEsc(st.reason)}</textarea></div>
      <div class="cl-row" style="align-items:flex-end">
        <label class="cl-field" style="flex:0 1 140px"><span class="cl-label">${t("cl_qty")}</span>
          <input class="field-input" data-f="qty" type="number" min="1" max="${left}" value="${st.qty}" inputmode="numeric"></label>
        <div class="cl-hint">${t("cl_qty_max",{n:left})}</div>
      </div>
    </div></div>`;
}

function clProblems(){
  const ship=shipments.find(s=>s.id===clShipId); if(!ship||!clStore) return ["-"];
  const keys=Object.keys(clSel); if(!keys.length) return [""];
  const out=[];
  keys.forEach(k=>{
    const it=(ship.stores[clStore]||[]).find(x=>clKey(x)===k); if(!it) return;
    const st=clSel[k], left=it.qty-clClaimed(clStore,it.itemId,it.optName), name=it.itemName;
    if(!st.type) out.push(t("cl_e_type",{name}));
    if((st.type==="파손"||st.type==="불량")&&!st.photos.length) out.push(t("cl_e_photo",{name}));
    if(!st.reason.trim()) out.push(t("cl_e_reason",{name}));
    if(!(st.qty>=1&&st.qty<=left)) out.push(t("cl_e_qty",{name,n:Math.max(0,left)}));
  });
  if(!clReporter.trim()) out.push(t("cl_e_reporter"));
  return out;
}
function clValidate(){
  const btn=document.getElementById("cl-submit"); if(!btn) return;
  const p=clProblems();
  btn.disabled=p.length>0;
  const err=document.getElementById("cl-err"); if(err) err.textContent=p[0]||"";
}

const claimPage=document.getElementById("claim-page");
claimPage.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="cl-season"){ clShipId=el.value; clStore=""; clSel={}; renderClaim(); return; }
  if(el.id==="cl-store"){ clStore=el.value; clSel={}; renderClaim(); return; }
  if(el.type==="file"){
    const k=el.closest(".cl-form").dataset.k, st=clSel[k];
    const files=[...el.files].slice(0,3-st.photos.length); if(!files.length) return;
    st.busy=true; renderClaim();
    for(const f of files){ try{ st.photos.push(await compressImage(f,1200,0.7)); }catch(err){ console.error(err); } }
    st.busy=false; renderClaim();
  }
});
claimPage.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="cl-reporter"){ clReporter=el.value; clValidate(); return; }
  const f=el.closest(".cl-form"); if(!f) return; const st=clSel[f.dataset.k];
  if(el.dataset.f==="reason") st.reason=el.value;
  if(el.dataset.f==="qty") st.qty=parseInt(el.value,10)||0;
  clValidate();
});
claimPage.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="goto-stock"){ switchTab("stock"); return; }
  if(act==="submit"){ submitClaims(); return; }
  const head=e.target.closest(".cl-item-head");
  if(head){ if(head.classList.contains("cl-off")) return; const k=head.dataset.k;
    if(clSel[k]) delete clSel[k]; else clSel[k]={type:"",photos:[],reason:"",qty:1};
    renderClaim(); return; }
  const chip=e.target.closest(".cl-chip");
  if(chip){ clSel[chip.closest(".cl-form").dataset.k].type=chip.dataset.type; renderClaim(); return; }
  const del=e.target.closest("img[data-del]");
  if(del){ clSel[del.closest(".cl-form").dataset.k].photos.splice(+del.dataset.del,1); renderClaim(); }
});

async function submitClaims(){
  if(clProblems().length){ clValidate(); return; }
  const ship=shipments.find(s=>s.id===clShipId);
  const btn=document.getElementById("cl-submit"); btn.disabled=true; btn.textContent="…";
  const today=clFmt(new Date());
  let ok=0;
  try{
    for(const k of Object.keys(clSel)){
      const it=ship.stores[clStore].find(x=>clKey(x)===k), st=clSel[k];
      await addDoc(collection(db,"claims"),{
        shipmentId:ship.id, storeName:clStore, itemId:it.itemId, itemName:it.itemName, optName:it.optName||"",
        collection:it.collection||"", type:st.type, reason:st.reason.trim(), qty:st.qty, shipped:it.qty,
        photos:st.photos, reporter:clReporter.trim(), status:"검토중", date:today, createdAt:serverTimestamp()
      });
      delete clSel[k]; ok++;
    }
    showToast(t("cl_ok",{n:ok}));
  }catch(err){
    console.error(err);
    showToast(t("ms_save_err")+(ok?` (${ok}✓)`:"")+": "+err.message,"var(--low)");
  }
  renderClaim();
}

window.previewPhotos=async()=>{
  const files=Array.from(document.getElementById("order-photos")?.files||[]);
  if(!files.length)return;
  if(files.length>3){showToast(t("ms_max3"),"var(--accent)");return;}
  orderPhotosBase64=[];
  const wrap=document.getElementById("photo-preview-wrap");
  if(wrap)wrap.innerHTML=`<div style="font-size:11px;color:var(--muted);width:100%;margin-bottom:4px">${t("compressing")}</div>`;
  for(const file of files){
    const compressed=await compressImage(file);
    orderPhotosBase64.push(compressed);
    if(wrap){
      const img=document.createElement("img");
      img.src=compressed;
      img.style.cssText="width:72px;height:72px;object-fit:cover;border-radius:0;border:1px solid var(--line)";
      wrap.appendChild(img);
    }
  }
  const firstChild=wrap?.querySelector("div");
  if(firstChild)firstChild.remove();
  document.getElementById("photo-count-label") && (document.getElementById("photo-count-label").textContent=`${files.length}${t("n_selected")}`);
};

window.confirmOrder=async(skipLateCheck=false)=>{
  const storeName=document.getElementById("store-name").value.trim();
  const orderType=document.querySelector('input[name="order-type"]:checked')?.value;
  const reason=document.getElementById("order-reason").value.trim();
  if(!storeName){showToast(t("ms_need_store"),"var(--low)");return;}
  const ordererName=document.getElementById("orderer-name").value.trim().replace(/\s+/g," ");
  if(!ordererName){showToast(t("ms_need_orderer"),"var(--low)");document.getElementById("orderer-name").focus();return;}
  if(!orderType){showToast(t("ms_need_type"),"var(--low)");return;}
  // 오픈 매장 발주는 상세 사유 선택 사항
  if(orderType!=="오픈" && !reason){showToast(t("ms_need_detail"),"var(--low)");return;}
  if(orderType==="파손"&&orderPhotosBase64.length===0){showToast(t("ms_need_photo"),"var(--low)");return;}

  // 늦은 접수 경고 팝업
  if(!skipLateCheck && isLateOrder()){
    const shipDate=getLateShipDate();
    showLateOrderModal(shipDate);
    return;
  }
  // 재고 차감 — 발주 요청 시점에 즉시 뺀다 (오버부킹 방지)
  // 취소·반려 시에는 관리자 화면에서 되돌린다
  // 같은 품목의 여러 옵션이 서로 덮어쓰지 않도록 품목 단위로 모아서 한 번에 쓴다
  const deductProblems=[];
  const byItem={};
  for(const c of cart){
    const q=Number(c.qty)||0; if(!q) continue;
    (byItem[c.itemId]=byItem[c.itemId]||[]).push({optName:c.optName||null,qty:q,itemName:c.itemName});
  }
  for(const itemId of Object.keys(byItem)){
    const item=items.find(i=>i.id===itemId);
    if(!item){ deductProblems.push(`${byItem[itemId][0].itemName||itemId} — 재고에 없는 품목`); continue; }
    const clone=JSON.parse(JSON.stringify(item));
    for(const a of byItem[itemId]){
      const hasOpts=Array.isArray(clone.options)&&clone.options.length>0;
      if(hasOpts){
        const o=a.optName?clone.options.find(x=>x.name===a.optName):null;
        if(!o){ deductProblems.push(`${item.name}${a.optName?" ["+a.optName+"]":""} — 옵션을 찾지 못해 차감되지 않았어요`); continue; }
        o.quantity=(o.quantity||0)-a.qty;   // 0으로 깎지 않는다 (취소 복구와 대칭이 깨짐)
      }else{
        clone.quantity=(clone.quantity||0)-a.qty;
      }
    }
    try{ await setDoc(doc(collection(db,"items"),itemId),clone); }
    catch(e){ deductProblems.push(`${item.name} — 재고 차감 저장 실패`); console.error(e); }
  }
  if(deductProblems.length){
    alert("⚠️ 아래 품목은 재고에서 차감되지 않았어요. 관리자에게 알려주세요.\n\n- "+deductProblems.join("\n- "));
  }

  // 발주 저장
  try{
    const ref=await addDoc(collection(db,"orders"),{
      storeName,status:"검토중",
      ordererMasked:maskName(ordererName),
      orderType:orderType||"",
      reason:reason?`[${orderType}] ${reason}`:`[${orderType}]`,
      photos:orderPhotosBase64,
      weekLabel:getWeekLabel(new Date().toISOString()),
      createdAt:serverTimestamp(),
      date:todayDate(),time:nowTime(),
      items:cart.map(c=>({itemId:c.itemId,itemName:c.itemName,optName:c.optName||null,collection:c.collection,qty:c.qty,unit:c.unit}))
    });
    // 전체 이름은 관리자만 읽을 수 있는 별도 칸(orderContacts)에 따로 저장한다
    try{ await setDoc(doc(db,"orderContacts",ref.id),{name:ordererName,createdAt:serverTimestamp()}); }
    catch(e){ console.error("발주자 이름 저장 실패",e); }
  }catch(e){showToast(t("ms_save_err")+": "+e.message,"var(--low)");return;}
  cart=[];orderPhotosBase64=[];openOrderFromExcel=false;updateCartBadge();
  closeModal("checkout-modal");
  showToast(t("ms_order_ok"));
  switchTab("orders");
};

// ── 렌더 재고 ──
// 컬렉션 색 (구글 시트 Apps Script의 COLL_COLORS와 같은 계열). 목록에 없는 컬렉션은 회색.
const COLL_COLORS={
  "MM2":["#fff8e1","#c99a1e"],"MM":["#fff8e1","#b08a2a"],"VEGGIE":["#e8f5e9","#4f8f5a"],"PRADA":["#fff3e0","#d9822b"],
  "BOLD":["#e3f2fd","#3d7cc9"],"BOUQUET":["#fce4ec","#c95b85"],"JEWELRY":["#e8eaf6","#5a63b8"],
  "POCKET X BRATZ":["#f3e5f5","#9c4fb0"],"FALL SEASON":["#fbe9e7","#c4633f"],"CIRCUIT X DISNEY":["#e0f7fa","#2a9aa8"]
};
// 발주자 이름 가리기: 각 단어의 첫 글자(3글자 이상이면 마지막 글자도)만 보이고 나머지는 * (예: 홍길동 → 홍*동, Jane Kim → J**e K*m)
function maskName(n){
  return String(n||"").trim().split(/\s+/).filter(Boolean).map(w=>{
    const c=[...w]; if(c.length<=1) return w; if(c.length===2) return c[0]+"*";
    return c[0]+"*".repeat(c.length-2)+c[c.length-1];
  }).join(" ");
}
// 재고 부족 상품의 입고 안내 (관리자가 관리자 화면에서 입력: 입고 예정일 / 입고 예정 없음 / 직접 입력)
function restockNote(item){
  const r=item.restock; if(!r||!r.type) return "";
  let txt="";
  if(r.type==="date"&&r.date){ const m=String(r.date).match(/^(\d{4})-(\d{2})-(\d{2})$/); txt=t("restock_date",{d:m?`${+m[2]}/${+m[3]}`:r.date}); }
  else if(r.type==="none") txt=t("no_restock");
  else if(r.type==="text"&&r.text) txt=String(r.text);
  return txt?`<span class="restock-note">${escAttr(txt)}</span>`:"";
}
function escAttr(v){return String(v??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function collVars(c){const k=COLL_COLORS[String(c||"").trim().toUpperCase()]||["#efede8","#8a8780"];return `--tint:${k[0]};--dot:${k[1]}`;}
function renderStock(){
  const total=items.reduce((a,i)=>a+totalQty(i),0);
  const low=items.filter(isLow);
  const years=[...new Set(items.map(i=>String(i.year||"")).filter(Boolean))].sort().reverse();
  const byYear=filterYear==="전체"?items:items.filter(i=>String(i.year||"")==filterYear);
  // 컬렉션 순서: 신규 컬렉션이 왼쪽 (연도 내림차순 → 컬렉션별 커스텀 순서)
  // 컬렉션별 최소 _order 기준 정렬
  const collMinOrder={};
  byYear.forEach(i=>{
    const c=i.collection; if(!c)return;
    const o=i._order??9999;
    if(collMinOrder[c]===undefined||o<collMinOrder[c]) collMinOrder[c]=o;
  });
  const colls=[...new Set(byYear.map(i=>i.collection).filter(Boolean))]
    .sort((a,b)=>(collMinOrder[a]??9999)-(collMinOrder[b]??9999));
  const ac=colls.includes(filterColl)?filterColl:"전체";

  document.getElementById("stock-stats").innerHTML=[
    {l:t("stat_items"),v:nu(items.length,"unit_type"),c:"var(--ink)"},

  }).join("")+`<button class="fbtn low-chip ${showLowOnly?"on":""}" onclick="window.toggleLowOnly()">${t("stat_low")}<span class="fcount">${low.length}</span></button>`;

  const sq=stockSearch.trim().toUpperCase();

    (!sq||[i.name,i.collection,i.material].some(v=>String(v||"").toUpperCase().includes(sq)))&&
    (showLowOnly?isLow(i):true)&&
    (filterYear==="전체"||String(i.year||"")==filterYear)&&
    (ac==="전체"||i.collection===ac)
  );
  const grouped={};
  [...filtered].sort((a,b)=>(a._order||0)-(b._order||0)).forEach(item=>{
    const k=[item.year,item.collection].filter(Boolean).join(" - ")||"미분류";

  }

  // 그룹별 최소 _order 기준 정렬 (프로그램 = 시트 동일 순서)
  const groupMinOrder={};

    groupMinOrder[k]=Math.min(...gitems.map(i=>i._order??9999));

  const sortedKeys=Object.keys(grouped).sort((a,b)=>groupMinOrder[a]-groupMinOrder[b]);
  document.getElementById("stock-groups").innerHTML=sortedKeys.map(gk=>{const gitems=grouped[gk];{

      const inCart=cart.filter(c=>c.itemId===item.id).reduce((a,c)=>a+c.qty,0);
      const sel=hasOpts?`<select class="card-opt" id="opt-${item.id}" aria-label="${t("opt_select")}">${item.options.map(o=>`<option value="${escAttr(o.name)}" ${(o.quantity||0)<=0?"disabled":""}>${tOpt(o.name)} · ${o.quantity||0}</option>`).join("")}</select>`:"";
      const btn=qty<=0&&!hasOpts?`<button class="btn-cart" disabled>${t("soldout")}</button>`

    return`<div class="collection-group">

      </div>
      ${!isCol?`<div class="items-wrap"><div class="item-grid">${cards}</div></div>`:""}
    </div>`;
  }}).join("");
}

window.changeCartQty=(i,delta)=>{
  const c=cart[i]; if(!c) return;
  const next=c.qty+delta;
  if(next<=0){ cart.splice(i,1); updateCartBadge(); renderCart(); return; }
  // 재고 상한 확인
  const item=items.find(x=>x.id===c.itemId);
  let stock=0;
  if(item){
    if(c.optName&&item.options?.length){ const o=item.options.find(x=>x.name===c.optName); stock=o?(o.quantity||0):0; }
    else stock=totalQty(item);
  }
  if(delta>0&&next>stock){ showToast(t("ms_over_cur",{n:stock}),"var(--low)"); return; }
  c.qty=next; updateCartBadge(); renderCart();
};

// ── 늦은 접수 여부 확인 (금 18시 이후 ~ 일요일) ──
function isLateOrder(){
  const now=new Date();
  const day=now.getDay(); // 0=일,1=월,...,6=토
  const hour=now.getHours();
  // 금요일 18시 이후
  if(day===5&&hour>=18) return true;
  // 토요일 전체
  if(day===6) return true;
  // 일요일 전체
  if(day===0) return true;
  return false;
}

// 늦은 접수 시 발송 예정일 계산
function getLateShipDate(){
  const now=new Date();
  const day=now.getDay();
  // 다음 주 월요일 찾기
  const nextMon=new Date(now);
  if(day===5) nextMon.setDate(now.getDate()+3);      // 금→다음월
  else if(day===6) nextMon.setDate(now.getDate()+2); // 토→다음월
  else if(day===0) nextMon.setDate(now.getDate()+1); // 일→다음월
  // 그 다음 주 화요일 (다음 월요일 + 8일)
  const shipTue=new Date(nextMon);shipTue.setDate(nextMon.getDate()+8);
  return `${shipTue.getMonth()+1}/${shipTue.getDate()}(${(DAY_DISP[LANG]||KO_DAYS)[2]})`;
}

// ── 수정 가능 여부 확인 ──
function canEdit(){
  const now=new Date();
  const day=now.getDay(); // 0=일
  const hour=now.getHours();
  // 일요일 21시 이후 수정 불가
  if(day===0&&hour>=21) return false;
  return true;
}

function getNoticeBanner(){
  const now=new Date();
  const day=now.getDay(); // 0=일,1=월,...,6=토
  const hour=now.getHours();

  // 차주 화요일 계산 (이번 주 월~금 기준)
  // 이번 주 월요일 찾기
  const mon=new Date(now);
  const diffToMon=day===0?1:(day===6?2:(day-1));
  if(day===0) mon.setDate(now.getDate()+1);
  else if(day===6) mon.setDate(now.getDate()+2);
  else mon.setDate(now.getDate()-(day-1));

  // 차주 화요일 = 이번 주 월요일 + 8일
  const nextTue=new Date(mon);nextTue.setDate(mon.getDate()+8);
  const _D=DAY_DISP[LANG]||KO_DAYS;
  const tueFmt=`${nextTue.getMonth()+1}/${nextTue.getDate()}(${_D[2]})`;

  // 다다음 주 화요일
  const nextNextTue=new Date(nextTue);nextNextTue.setDate(nextTue.getDate()+7);
  const nextNextFmt=`${nextNextTue.getMonth()+1}/${nextNextTue.getDate()}(${_D[2]})`;

  // 이번 주 금요일
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const friFmt=`${fri.getMonth()+1}/${fri.getDate()}(${_D[5]})`;

  if(day===6||day===0){
    // 토/일 - 다음 주로 집계
    return{
      color:"var(--accent)",
      bg:"var(--bg)",
      border:"var(--accent)",
      icon:"📅",
      title:t("bn_weekend"),
      desc:t("bn_now_ship",{d:nextNextFmt})
    };
  } else if(day===1||day===2){
    // 월,화 - 이번 주 발송 마감, 지금 주문은 차차주
    return{
      color:"var(--low)",
      bg:"transparent",
      border:"var(--low)",
      icon:"⚠️",
      title:t("bn_this_until",{a:friFmt,d:tueFmt}),
      desc:t("bn_today_new",{d:nextNextFmt})
    };
  } else {
    // 수~금
    return{
      color:"var(--ok)",
      bg:"var(--ok-bg)",
      border:"var(--ok)",
      icon:"📦",
      title:t("bn_ship_this",{d:tueFmt}),
      desc:t("bn_edit_until",{d:friFmt})
    };
  }
}

window.confirmOrderEdit=async()=>{
  if(!canEdit()){showToast(t("ms_closed"),"var(--low)");return;}
  const newQty=parseInt(document.getElementById("order-edit-qty")?.value);
  if(!newQty||newQty<1){showToast(t("ms_bad_qty"),"var(--low)");return;}
  const order=orders.find(o=>o.id===editOrderId);
  if(!order)return;
  const oldQty=order.items[editItemIdx].qty;
  const diff=newQty-oldQty; // 양수면 추가, 음수면 차감
  // 재고 재조정
  const it=order.items[editItemIdx];
  const item=items.find(i=>i.id===it.itemId);
  if(item&&diff!==0){
    const clone=JSON.parse(JSON.stringify(item));
    if(it.optName&&clone.options){
      const o=clone.options.find(x=>x.name===it.optName);
      if(o){
        if(diff>0&&o.quantity<diff){showToast(t("ms_over_add",{n:o.quantity}),"var(--low)");return;}
        o.quantity=Math.max(0,o.quantity-diff);
      }
    }else{
      if(diff>0&&clone.quantity<diff){showToast(t("ms_over_add",{n:clone.quantity}),"var(--low)");return;}
      clone.quantity=Math.max(0,(clone.quantity||0)-diff);
    }
    try{await setDoc(doc(collection(db,"items"),item.id),clone);}catch(e){}
  }
  // 주문 수량 업데이트
  const updatedItems=order.items.map((it,i)=>i===editItemIdx?{...it,qty:newQty}:it);
  try{
    await setDoc(doc(collection(db,"orders"),editOrderId),{...order,items:updatedItems},{merge:false});
    document.getElementById("order-edit-modal")?.remove();
    showToast(t("ms_qty_ok"));
  }catch(e){showToast(t("ms_save_err")+": "+e.message,"var(--low)");}
};

// ── 렌더 출고요청 ──
let orderSearch="";
function matchesOrderSearch(o,q){
  if(!q) return true;
  const hay=[
    o.storeName||"",
    o.reason||"",
    ...(o.items||[]).map(it=>`${it.itemName||""} ${it.optName||""} ${it.collection||""}`)
  ].join(" ").toLowerCase();
  // 공백으로 나눈 모든 단어가 포함되어야 매칭
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}

  });

  if(!collapsedWeeks.has("__init__")){
    Object.keys(grouped).forEach(week=>{
      if(week!==currentWeek) collapsedWeeks.add(week.replace(/[/]/g,"_"));
    });
    collapsedWeeks.add("__init__");
  }
  // 검색 중에는 모든 주차를 펼쳐서 보여줌
  const isWeekCollapsed=wk=>searching?false:collapsedWeeks.has(wk);
  const el=document.getElementById("orders-list");

  // 안내 배너 (검색 중에는 결과 요약으로 대체)
  const banner=searching
    ? `<div style="background:var(--bg);border:1px solid var(--line);border-radius:0;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--sub)">
         🔍 "<strong>${q}</strong>" — <strong>${t("search_result",{n:filteredOrders.length})}</strong>
       </div>`
    : `<div style="background:${notice.bg};border:1px solid ${notice.border};border-radius:0;padding:12px 14px;margin-bottom:16px">
    <div style="font-weight:700;font-size:13px;color:${notice.color};margin-bottom:4px">${notice.icon} ${notice.title}</div>
    <div style="font-size:12px;color:${isDark?"var(--muted)":"var(--muted)"}">${notice.desc}</div>
  </div>`;

  if(!Object.keys(grouped).length){
    el.innerHTML=banner+`<div style="text-align:center;padding:40px 20px;font-size:14px;color:var(--muted)">${searching?t("search_none"):t("no_orders")}</div>`;return;
  }

  el.innerHTML=banner+Object.entries(grouped).map(([week,wOrders])=>`
    <div class="week-group">
      <div class="week-header" onclick="window.toggleWeek('${week.replace(/[/]/g,"_")}')" style="cursor:pointer;border-radius:${isWeekCollapsed(week.replace(/[/]/g,"_"))?"0":"0"}">
        <span>📅</span>
        <span style="color:var(--ink)">${fmtWeek(week)}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--ink)">${nu(wOrders.length,"unit_case")}</span>
        <span style="font-size:11px;color:var(--muted);margin-left:6px">${isWeekCollapsed(week.replace(/[/]/g,"_"))?"▶":"▼"}</span>
      </div>
      ${isWeekCollapsed(week.replace(/[/]/g,"_"))?"":(`
      <div style="padding:7px 14px;font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-left:1px solid var(--ok);border-right:1px solid var(--ok)">
        📦 ${(()=>{
          // 주차 레이블에서 월요일 날짜 추출해서 차주 화요일 계산
          const parts=week.match(/(\d+)\/(\d+)/);
          const now=new Date();
          if(!parts)return t("bn_week_ship",{d:"-"});
          const mon=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[2]));
          const tue=new Date(mon);tue.setDate(mon.getDate()+8);
          const dd=(DAY_DISP[LANG]||KO_DAYS)[2];
          return t("bn_week_ship",{d:`${tue.getMonth()+1}/${tue.getDate()}(${dd})`});
        })()}
      </div>
      <div class="week-cycle">
        ${[{l:t("monfri"),d:t("cyc_intake"),c:"var(--sub)"},{l:(DAY_BADGE[LANG]||KO_DAYS)[1],d:t("cyc_prep"),c:"var(--ink)"},{l:(DAY_BADGE[LANG]||KO_DAYS)[2],d:t("cyc_ship"),c:"var(--ok)"}].map(s=>
          `<div class="cycle-badge"><span style="font-weight:700;color:${s.c};padding:1px 6px;border-radius:0;background:transparent;font-size:11px">${s.l}</span><span style="color:${isDark?"var(--muted)":"var(--muted)"};font-size:10px">${s.d}</span></div>`
        ).join("")}
      </div>
      <div class="order-list">
        ${wOrders.map(order=>`
        <div class="order-row">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <div style="font-weight:700;font-size:14px;flex:1;display:flex;align-items:center;gap:6px">
              ${order.storeName}${order.ordererMasked?`<span class="orderer-masked">· ${escAttr(order.ordererMasked)}</span>`:""}
              ${editable&&order.status==="검토중"?`<button onclick="openStoreNameEditModal('${order.id}','${order.storeName.replace(/'/g,"\\'")}')"
                style="padding:2px 7px;border-radius:0;font-size:9px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--sub);cursor:pointer;flex-shrink:0">✏️ ${t("btn_edit")}</button>`:""}
            </div>
            ${statusBadgeHTML(order.status)}
            <div style="font-size:10px;color:${isDark?"var(--muted)":"var(--muted)"}">${order.date||""}</div>
          </div>
          ${(order.status==="취소"&&order.cancelReason)?`<div style="font-size:11px;padding:6px 10px;border-radius:0;background:transparent;border:1px solid var(--low);color:var(--low);margin-bottom:8px">${t("rsn_cancel")}: ${order.cancelReason}</div>`:""}
          ${(order.status==="반려"&&order.rejectReason)?`<div style="font-size:11px;padding:6px 10px;border-radius:0;background:transparent;border:1px solid var(--low);color:var(--low);margin-bottom:8px">${t("rsn_reject")}: ${order.rejectReason}</div>`:""}
          ${order.reason?`<div style="font-size:11px;padding:6px 10px;border-radius:0;background:var(--bg);border:1px solid var(--bg);color:var(--sub);margin-bottom:8px">${t("rsn_request")}: ${fmtReason(order.reason)}</div>`:""}
          ${order.photos?.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${order.photos.map(p=>`<img src="${p}" style="width:60px;height:60px;object-fit:cover;border-radius:0;border:1px solid var(--line)">`).join("")}</div>`:""}
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${order.items.map((it,idx)=>`
            <div class="item-chip" style="display:inline-flex;align-items:center;gap:4px">
              <span style="font-size:9px;color:var(--ink);font-weight:600">${it.collection}</span>
              ${it.itemName}${it.optName?` [${tOpt(it.optName)}]`:""}
              <strong style="color:${isDark?"var(--ink)":"var(--ink)"}">${it.unit==="개"?nu(it.qty,"unit_pcs"):it.qty+it.unit}</strong>
              ${editable&&order.status==="검토중"?`<button onclick="openOrderEditModal('${order.id}',${idx},'${it.itemName}${it.optName?" ["+it.optName+"]":""}',${it.qty},'${it.unit}')"
                style="padding:1px 6px;border-radius:0;font-size:9px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--sub);cursor:pointer;flex-shrink:0">${t("btn_edit")}</button>`:""}
            </div>`).join("")}
          </div>
        </div>`).join("")}
      </div>`)}
    </div>`).join("");
}

// ── 출고요청 검색 ──
(function initOrderSearch(){
  const input=document.getElementById("order-search");
  const clearBtn=document.getElementById("order-search-clear");
  if(!input) return;
  let timer=null;
  const apply=()=>{
    orderSearch=input.value;
    if(clearBtn) clearBtn.style.display=input.value?"block":"none";
    renderOrders();
  };
  input.addEventListener("input",()=>{
    clearTimeout(timer);
    timer=setTimeout(apply,180); // 타이핑 중 과도한 렌더 방지
  });
  input.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ input.value=""; apply(); input.blur(); }
    if(e.key==="Enter"){ clearTimeout(timer); apply(); input.blur(); }
  });
  clearBtn?.addEventListener("click",()=>{ input.value=""; apply(); input.focus(); });
})();

window.toggleWeek=wk=>{
  if(collapsedWeeks.has(wk))collapsedWeeks.delete(wk);
  else collapsedWeeks.add(wk);
  renderOrders();
};

// ── 매장명 수정 모달 ──
let editStoreOrderId=null;
window.openStoreNameEditModal=(orderId,currentName)=>{
  if(!canEdit()){showToast(t("ms_closed"),"var(--low)");return;}
  editStoreOrderId=orderId;
  const modal=document.createElement("div");modal.className="modal-bg";modal.id="store-edit-modal";
  modal.innerHTML=`<div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">${t("lbl_store")} — ${t("btn_edit")}</div>
    <div class="field-wrap">
      <div class="field-label">${t("lbl_store")}</div>
      <input id="store-edit-input" type="text" value="${currentName.replace(/"/g,"&quot;")}" class="field-input"
        onkeydown="if(event.key==='Enter')confirmStoreNameEdit()">
    </div>
    <button class="btn-primary" onclick="confirmStoreNameEdit()">${t("btn_save")}</button>
    <button class="btn-secondary-sm" onclick="document.getElementById('store-edit-modal').remove()">${t("btn_cancel")}</button>
  </div>`;
  modal.addEventListener("click",e=>{if(e.target===modal)modal.remove();});
  document.body.appendChild(modal);
  setTimeout(()=>{
    const inp=document.getElementById("store-edit-input");
    inp?.focus();inp?.select();
  },100);
};

window.confirmStoreNameEdit=async()=>{
  if(!canEdit()){showToast(t("ms_closed"),"var(--low)");return;}
  const newName=document.getElementById("store-edit-input")?.value.trim();
  if(!newName){showToast(t("ms_need_store"),"var(--low)");return;}
  const order=orders.find(o=>o.id===editStoreOrderId);
  if(!order)return;
  try{
    await setDoc(doc(collection(db,"orders"),editStoreOrderId),{...order,storeName:newName},{merge:false});
    document.getElementById("store-edit-modal")?.remove();
    showToast(t("ms_store_ok"));
  }catch(e){showToast(t("ms_save_err")+": "+e.message,"var(--low)");}
};

// ── 초기 언어 적용 ──
(function initLang(){
  const meta=LANG_META.find(l=>l.code===LANG);
  const lbl=document.getElementById("lang-label");
  if(lbl&&meta) lbl.textContent=meta.label;
  applyStaticI18n();
  // 언어 메뉴 바깥 클릭 시 닫기
  document.addEventListener("click",ev=>{
    const menu=document.getElementById("lang-menu");
    if(!menu||menu.style.display!=="block") return;
    if(!ev.target.closest("#lang-menu")&&!ev.target.closest("[onclick*='toggleLangMenu']")) menu.style.display="none";
  });
  // 언어 선택 항목 hover
  document.querySelectorAll(".lang-opt").forEach(el=>{
    el.addEventListener("mouseenter",()=>el.style.background="var(--bg)");
    el.addEventListener("mouseleave",()=>el.style.background="");
  });
})();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    // 새 버전 감지 시 즉시 업데이트
    reg.addEventListener('updatefound',()=>{
      const newSW=reg.installing;
      newSW.addEventListener('statechange',()=>{
        if(newSW.state==='installed'&&navigator.serviceWorker.controller){
          // 새 버전 발견 시 자동 새로고침
          navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
          newSW.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  });
}
</script>
